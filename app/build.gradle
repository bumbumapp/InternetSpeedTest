apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... / ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def adsProps = new Properties()
def adsPropsFile = rootProject.file('ads.properties')
if (adsPropsFile.exists()) adsPropsFile.withInputStream { adsProps.load(it) }
def adId = { String key, String fallback -> ((project.findProperty(key) ?: adsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = adId('HMS_BANNER_ID', 'q2ssxxpiwb')
def HMS_INTERSTITIAL_ID = adId('HMS_INTERSTITIAL_ID', 'h8y0yss3dt')

android {
    namespace 'com.code.bumbumapps.netspeed'
    compileSdk 36

    lint {
        disable 'InvalidPackage'
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.bumbumapps.internetspeedtest"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "2.0.1"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app for com.bumbumapps.internetspeedtest, from the AdMob API).
            resValue 'string', 'app_id', 'ca-app-pub-8444865753152507~7131107606'
            resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/3762708230'
            resValue 'string', 'interstial_id', 'ca-app-pub-8444865753152507/4273273307'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation('com.github.jtv7:RippleSwitch:1.0') {
        // Its classes do not use the old support library (checked); AndroidX already provides it.
        exclude group: 'com.android.support'
    }

    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
